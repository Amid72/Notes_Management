{% extends "base.html" %}
{% block title %}Reset Password - NotesVault{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block content %}
<div class="auth-scene">
  <div class="floating-shapes">
    <div class="shape sphere"></div>
    <div class="shape ring"></div>
  </div>

  <div class="auth-card-wrapper">
    <div class="auth-card tilt-card">
      <div class="auth-card-glow"></div>
      <div class="text-center mb-4">
        <div class="auth-icon-3d"><i class="bi bi-shield-lock-fill"></i></div>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Set a new password for your account</p>
      </div>

      <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
        <div class="form-floating-3d mb-3">
          <i class="bi bi-lock-fill field-icon"></i>
          <input type="password" class="form-control input-3d" name="new_password" placeholder="New Password" required autofocus>
          <label>New Password</label>
        </div>

        <div class="form-floating-3d mb-3">
          <i class="bi bi-lock-fill field-icon"></i>
          <input type="password" class="form-control input-3d" name="confirm_password" placeholder="Confirm New Password" required>
          <label>Confirm New Password</label>
        </div>

        <button type="submit" class="btn btn-3d-primary w-100">
          <span>Reset Password</span> <i class="bi bi-check-circle-fill"></i>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/login3d.js') }}"></script>
{% endblock %}
